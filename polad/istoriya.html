<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>История экзаменов Полада</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: squared exercise paper; a summary strip (count, average, grade distribution) then every attempt grouped by day */
:root{
  --paper:#fbfcff; --grid:#d9e4f5; --ink:#1f3a8a; --text:#1d2433; --muted:#5b6578;
  --line:#c9d3e6; --ok:#1c8a4a; --okbg:#e5f5ec; --mid:#b26a00; --midbg:#fff1dc; --bad:#c62828; --badbg:#fdeaea; --card:#ffffff;
  --hand:"Caveat","Comic Sans MS",cursive; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a26; --grid:#1f2a3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa5ba;
  --line:#2c3a52; --ok:#4cc985; --okbg:#173326; --mid:#f0b45a; --midbg:#3a2c14; --bad:#ff7a7a; --badbg:#3a1d1f; --card:#1a2131; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a26; --grid:#1f2a3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa5ba;
  --line:#2c3a52; --ok:#4cc985; --okbg:#173326; --mid:#f0b45a; --midbg:#3a2c14; --bad:#ff7a7a; --badbg:#3a1d1f; --card:#1a2131; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:24px 56px;display:flex;flex-direction:column;gap:18px}
.back{color:var(--ink);font-weight:700;text-decoration:none}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--hand);color:var(--ink);font-size:46px;line-height:1.05;margin:4px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 0 var(--line)}
.topic{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.btn{font:inherit;font-weight:800;font-size:16px;border:none;border-radius:12px;padding:10px 18px;cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* summary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-size:30px;font-weight:800;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums}
.stat .v.hand{font-family:var(--hand);font-size:44px;color:var(--bad);line-height:.9}
.stat .k{font-size:13px;color:var(--muted);font-weight:700}
.dist{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:26px 1fr 54px;gap:10px;align-items:center;font-variant-numeric:tabular-nums}
.bar .g{font-family:var(--hand);font-size:26px;line-height:1;text-align:center;color:var(--bad)}
.bar .track{height:14px;border-radius:7px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.bar .fill{height:100%;border-radius:7px;background:var(--ink)}
.bar.g5 .fill{background:var(--ok)} .bar.g4 .fill{background:var(--mid)} .bar.g3 .fill,.bar.g2 .fill{background:var(--bad)}
.bar .c{font-size:14px;color:var(--muted);text-align:right}
/* list */
.dayh{font-family:var(--hand);font-size:28px;color:var(--ink);line-height:1;margin:6px 0 0}
.list{display:flex;flex-direction:column;gap:8px}
.r{display:grid;grid-template-columns:1fr auto auto 32px;gap:4px 12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-variant-numeric:tabular-nums}
.r .when{grid-column:1/-1;font-size:14px;color:var(--muted)} .r .when b{color:var(--text)}
.r .what{font-weight:700;font-size:15px}
.r .n{font-weight:800} .r .t{color:var(--muted);font-size:15px}
.r .g{font-family:var(--hand);font-size:28px;color:var(--bad);line-height:1;text-align:center}
.r.fast .n::after{content:" ⚡";}
.empty{margin:0;color:var(--muted)}
.note{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./">← Все задания</a>
  <header>
    <span class="eyebrow">Математика · 3 класс</span>
    <h1>История экзаменов</h1>
  </header>
  <main id="app"></main>
  <p class="note">История хранится в браузере этого устройства и никогда не стирается сайтом. Чтобы иметь копию — нажми «Скачать таблицу».</p>
</div>

<script>
const app=document.getElementById("app");
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const clock=d=>new Date(d).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
const dayKey=d=>new Date(d).toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"});
const iso=d=>new Date(d).toLocaleDateString("ru-RU");
const get=k=>{try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}};
/* records from the 20-question exam and from trainer variants; older ones had only a finish stamp `d` */
const rows=[
  ...get("polad-exam-hist").map(r=>({...r,src:"exam"})),
  ...get("polad-tr-hist").map(r=>({...r,src:"tr"}))
].map(r=>({...r,s:r.s??(r.d-(r.t||0)*1000),e:r.e??r.d,len:r.len||20})).filter(r=>r.e).sort((a,b)=>b.e-a.e);
const label=r=>r.src==="exam"?"Экзамен · 20 вопросов":`Тренажёр · вариант ${r.v} · ${r.len} вопросов`;
const normOf=r=>({20:1200,10:600,30:1800}[r.len]||r.len*60);
const isFast=r=>r.g===5&&r.t<=normOf(r)*.75;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

function render(){
  if(!rows.length){app.innerHTML=`<section class="card"><p class="empty">Пока нет ни одного экзамена. Пройди экзамен или вариант в тренажёре — результат появится здесь.</p></section>`;return}
  const n=rows.length,avg=rows.reduce((a,r)=>a+r.g,0)/n,avgT=rows.reduce((a,r)=>a+r.t,0)/n;
  const pct=Math.round(100*rows.reduce((a,r)=>a+r.n/r.len,0)/n);
  const dist={5:0,4:0,3:0,2:0};rows.forEach(r=>dist[r.g]=(dist[r.g]||0)+1);
  const fives=rows.filter(r=>r.g===5),bestFast=fives.length?Math.min(...fives.map(r=>r.t)):null;
  let groups={},order=[];rows.forEach(r=>{const k=dayKey(r.s);if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(r)});
  app.innerHTML=`
  <section class="card">
    <div class="row"><span class="topic">Сводка за всё время</span><button class="btn ghost" id="csv">Скачать таблицу</button></div>
    <div class="stats">
      <div class="stat"><span class="v">${n}</span><span class="k">экзаменов сдано</span></div>
      <div class="stat"><span class="v hand">${avg.toFixed(1).replace(".",",")}</span><span class="k">средняя оценка<br>(с учётом времени)</span></div>
      <div class="stat"><span class="v">${pct}%</span><span class="k">верных ответов в среднем</span></div>
      <div class="stat"><span class="v">${fmt(avgT)}</span><span class="k">среднее время</span></div>
      <div class="stat"><span class="v">${dist[5]}</span><span class="k">пятёрок${bestFast!==null?`, лучшая за ${fmt(bestFast)}`:""}</span></div>
      <div class="stat"><span class="v">${rows.filter(isFast).length}</span><span class="k">⚡ отлично по времени</span></div>
    </div>
    <div class="dist">${[5,4,3,2].map(g=>`<div class="bar g${g}"><span class="g">${g}</span><div class="track"><div class="fill" style="width:${Math.round(100*dist[g]/n)}%"></div></div><span class="c">${dist[g]} · ${Math.round(100*dist[g]/n)}%</span></div>`).join("")}</div>
  </section>
  ${order.map(k=>`<h2 class="dayh">${cap(k)}</h2><div class="list">${groups[k].map(r=>`
    <div class="r${isFast(r)?" fast":""}">
      <span class="when"><b>${clock(r.s)} → ${clock(r.e)}</b> · ${label(r)}</span>
      <span class="what">${r.n} из ${r.len} верно${r.base&&r.base!==r.g?` <span class="t">(по знаниям ${r.base})</span>`:""}</span>
      <span class="t">⏱ ${fmt(r.t)}</span><span></span><span class="g">${r.g}</span>
    </div>`).join("")}</div>`).join("")}`;
  document.getElementById("csv").onclick=downloadCSV;
}

function downloadCSV(){
  const head=["Дата","Начало","Конец","Что","Вариант","Вопросов","Верно","Время (мм:сс)","Время (сек)","Оценка по знаниям","Итоговая оценка"];
  const lines=rows.slice().reverse().map(r=>[iso(r.s),clock(r.s),clock(r.e),r.src==="exam"?"Экзамен 20":"Тренажёр",r.v||"",r.len,r.n,fmt(r.t),r.t,r.base||r.g,r.g]);
  const csv="﻿"+[head,...lines].map(l=>l.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
  a.download=`polad-ekzameny-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();
}
render();
</script>
</body>
</html>
