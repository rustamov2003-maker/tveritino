<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Экзамен Полада</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a sheet of squared exercise paper; one task per screen, ink-blue handwriting accents, red teacher's marks */
:root{
  --paper:#fbfcff; --grid:#d9e4f5; --ink:#1f3a8a; --text:#1d2433; --muted:#5b6578;
  --line:#c9d3e6; --ok:#1c8a4a; --okbg:#e5f5ec; --mid:#b26a00; --midbg:#fff1dc; --bad:#c62828; --badbg:#fdeaea; --card:#ffffff;
  --hand:"Caveat","Comic Sans MS",cursive; --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141a26; --grid:#1f2a3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa5ba;
  --line:#2c3a52; --ok:#4cc985; --okbg:#173326; --mid:#f0b45a; --midbg:#3a2c14; --bad:#ff7a7a; --badbg:#3a1d1f; --card:#1a2131; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141a26; --grid:#1f2a3d; --ink:#8fb0ff; --text:#e6ebf5; --muted:#9aa5ba;
  --line:#2c3a52; --ok:#4cc985; --okbg:#173326; --mid:#f0b45a; --midbg:#3a2c14; --bad:#ff7a7a; --badbg:#3a1d1f; --card:#1a2131; color-scheme:dark}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--text);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:var(--hand);color:var(--ink);font-size:44px;line-height:1.05;margin:0;text-wrap:balance}
.progress{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:22px;height:8px;border-radius:4px;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.cur{background:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 2px 0 var(--line)}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.qnum{font-family:var(--hand);font-size:30px;color:var(--ink);line-height:1}
.topic{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.03em}
.qtext{font-size:20px;font-weight:700;margin:0;text-wrap:pretty}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font:inherit;font-size:18px;font-weight:600;color:var(--text);
  background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0;
  transition:border-color .15s,background .15s,transform .1s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:active:not(:disabled){transform:scale(.98)}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.opt:disabled{cursor:default}
.letter{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--hand);font-size:22px;
  color:var(--ink);border:2px solid var(--ink)}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .letter{color:var(--ok);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .letter{color:var(--bad);border-color:var(--bad)}
.opt.dim{opacity:.55}
.feedback{border-radius:12px;padding:12px 14px;font-size:16px}
.feedback b{font-family:var(--hand);font-size:24px;display:block;line-height:1.1;margin-bottom:2px}
.feedback.ok{background:var(--okbg);color:var(--text)} .feedback.ok b{color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--text)} .feedback.bad b{color:var(--bad)}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:800;font-size:17px;border:none;border-radius:12px;padding:12px 22px;cursor:pointer;background:var(--ink);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.mark{font-family:var(--hand);font-size:96px;line-height:.8;color:var(--bad);border:4px solid var(--bad);border-radius:50%;
  width:120px;height:120px;display:grid;place-items:center;transform:rotate(-8deg);flex:none}
.score p{margin:0}
.big{font-size:26px;font-weight:800}
.review{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.review li{border-left:4px solid var(--bad);padding:6px 0 6px 12px}
.review li.okk{border-left-color:var(--ok)}
.review .q{font-weight:700}
.review .a{color:var(--muted);font-size:15px}
.note{font-size:14px;color:var(--muted);text-align:center}
/* Timer: a sticky pill that stays in view while scrolling; turns amber past the "fast" mark, red past the norm */
.timer{position:sticky;top:8px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:8px 18px;box-shadow:0 2px 0 var(--line)}
.timer .tv{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);line-height:1}
.timer .tn{font-size:13px;color:var(--muted);font-weight:700;text-align:right;line-height:1.25}
.timer.warn{border-color:var(--mid)} .timer.warn .tv{color:var(--mid)}
.timer.over{border-color:var(--bad);background:var(--badbg)} .timer.over .tv{color:var(--bad)}
.timer.done{position:static}   /* frozen clock on the results screen: no longer floats over content */
.timer[hidden]{display:none}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px}
.hint{margin:0;color:var(--muted);font-size:15px}
.score>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.tline{font-size:18px} .tline b{font-variant-numeric:tabular-nums} .norm{color:var(--muted);font-size:15px}
.badge{display:inline-block;align-self:flex-start;background:var(--okbg);color:var(--ok);font-weight:800;border-radius:999px;padding:4px 12px}
.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.hist li{display:grid;grid-template-columns:1fr auto auto 28px;gap:12px;align-items:center;padding:6px 12px;border-radius:10px;
  background:var(--paper);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.hist li.now{border-color:var(--ink)}
.hist .hd{color:var(--muted);font-size:14px} .hist .ht{color:var(--muted);font-size:15px}
.hist .hg{font-family:var(--hand);font-size:26px;color:var(--bad);line-height:1;text-align:center}
.more{color:var(--ink);font-weight:700;text-decoration:none;font-size:15px}
.sum{margin:0;font-size:15px;color:var(--muted)} .sum b{color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>body{margin:0}*{box-sizing:border-box}</style>
</head>
<body>


<div class="wrap">
<p style="margin:0"><a href="./" style="color:var(--ink);font-weight:700;text-decoration:none">← Все задания</a></p>

  <header>
    <span class="eyebrow">Математика · 3 класс · по тетради Петерсон</span>
    <h1>Экзамен Полада</h1>
  </header>
  <div class="timer" id="timer" hidden role="timer" aria-live="off"><span class="tv" id="tval">00:00</span><span class="tn">норма 20:00<br>на отлично — до 15:00</span></div>
  <div class="progress" id="progress" aria-label="Прогресс"></div>
  <main id="stage"></main>
  <p class="note">20 вопросов на время · выбери один ответ из четырёх</p>
</div>

<script>
const Q = [
 {t:"Множества",q:"A — множество однозначных нечётных чисел. Какая запись верна?",o:["5 ∈ A","8 ∈ A","21 ∈ A","3 ∉ A"],a:0,
  e:"Однозначные нечётные: 1, 3, 5, 7, 9. Число 5 есть в A, а 8 — чётное, 21 — двузначное."},
 {t:"Пересечение множеств",q:"E = {2, 4, 6, 8}, F = {6, 7, 8}. Найди E ∩ F.",o:["{6, 8}","{2, 4, 6, 7, 8}","{7}","{2, 4}"],a:0,
  e:"Пересечение — это элементы, которые есть в обоих множествах: 6 и 8. {2, 4, 6, 7, 8} — это объединение."},
 {t:"Подмножество",q:"A — ласточки, B — птицы, C — животные. Какая запись верна?",o:["A ⊂ C","C ⊂ B","B ⊂ A","C ⊂ A"],a:0,
  e:"Каждая ласточка — птица, а каждая птица — животное. Значит, ласточки входят в животных: A ⊂ C."},
 {t:"Деление с остатком",q:"Выполни деление с остатком: 59 : 8 = ?",o:["7 (ост. 3)","7 (ост. 5)","6 (ост. 11)","8 (ост. 3)"],a:0,
  e:"8 · 7 = 56, 59 − 56 = 3. Проверка: 8 · 7 + 3 = 59. Остаток 11 быть не может — он больше делителя."},
 {t:"Деление с остатком",q:"В какой записи ошибка?",o:["39 : 4 = 8 (ост. 7)","57 : 6 = 9 (ост. 3)","80 : 25 = 3 (ост. 5)","78 : 7 = 11 (ост. 1)"],a:0,
  e:"Остаток всегда меньше делителя. 7 больше 4, значит ошибка. Правильно: 39 : 4 = 9 (ост. 3)."},
 {t:"Нумерация",q:"Запиши цифрами: 12 млрд 40 тыс. 38 ед.",o:["12 000 040 038","12 040 038","12 040 000 038","1 204 038"],a:0,
  e:"Классы: 12 | 000 млн | 040 тыс. | 038 ед. Пустой класс миллионов заполняем нулями."},
 {t:"Разряды",q:"Сколько всего десятков тысяч в числе 2 170 548?",o:["217","7","170","21"],a:0,
  e:"«Всего десятков тысяч» — отбрасываем 4 последние цифры: 2 170 548 → 217. А цифра в разряде десятков тысяч — это 7."},
 {t:"Составь число",q:"Самое маленькое четырёхзначное число из цифр 2, 5, 0, 9 (каждая один раз):",o:["2059","0259","2095","9520"],a:0,
  e:"С нуля число начинаться не может. Ставим впереди самую маленькую ненулевую цифру 2, потом 0, 5, 9."},
 {t:"Единицы массы",q:"8 т 3 ц 16 кг = … кг",o:["8316 кг","80 316 кг","830 016 кг","8336 кг"],a:0,
  e:"1 т = 1000 кг, 1 ц = 100 кг. 8000 + 300 + 16 = 8316 кг."},
 {t:"Единицы длины",q:"30 м − 4 м 8 см = ?",o:["25 м 92 см","26 м 92 см","26 м 2 см","25 м 2 см"],a:0,
  e:"3000 см − 408 см = 2592 см = 25 м 92 см."},
 {t:"Единицы времени",q:"4 сут. 2 ч 25 мин = … мин",o:["5905 мин","5880 мин","1705 мин","6025 мин"],a:0,
  e:"4 сут. = 96 ч, 96 + 2 = 98 ч. 98 · 60 = 5880 мин, 5880 + 25 = 5905 мин."},
 {t:"Время",q:"Пароход отошёл от пристани в 9 ч 18 мин и прибыл в 14 ч 14 мин. Сколько времени он был в пути?",o:["4 ч 56 мин","5 ч 4 мин","5 ч 56 мин","4 ч 4 мин"],a:0,
  e:"14 ч 14 мин − 9 ч 18 мин: займём 1 ч → 13 ч 74 мин − 9 ч 18 мин = 4 ч 56 мин."},
 {t:"Календарь",q:"Костя родился 25 января 1993 года, а его друг младше на 5 недель и 4 дня. Когда родился друг?",o:["5 марта 1993","4 марта 1993","1 марта 1993","28 февраля 1993"],a:0,
  e:"5 недель 4 дня = 39 дней. До 31 января — 6 дней, февраль 1993 — 28 дней (итого 34), ещё 5 дней → 5 марта."},
 {t:"Порядок действий",q:"(3 + 27 : 3) · 5 − 60 · 3 : 90 + 8 · (7 − 7) : 4 = ?",o:["58","60","2","62"],a:0,
  e:"27 : 3 = 9; 3 + 9 = 12; 12 · 5 = 60; 60 · 3 : 90 = 2; 8 · 0 : 4 = 0. Итого 60 − 2 + 0 = 58."},
 {t:"Уравнения",q:"Реши уравнение: 72 : (12 − x : 4) = 9",o:["x = 16","x = 4","x = 80","x = 12"],a:0,
  e:"12 − x : 4 = 72 : 9 = 8 → x : 4 = 4 → x = 16. Проверка: 72 : (12 − 4) = 9."},
 {t:"Площадь и периметр",q:"Площадь прямоугольника 45 м², одна сторона 5 м. Найди периметр.",o:["28 м","14 м","50 м","45 м"],a:0,
  e:"Вторая сторона: 45 : 5 = 9 м. P = (5 + 9) · 2 = 28 м."},
 {t:"Объём",q:"Бассейн: длина 50 м, ширина 8 м, высота 3 м. Сколько кубических метров воды в нём помещается?",o:["1200 м³","400 м³","61 м³","122 м³"],a:0,
  e:"V = a · b · c = 50 · 8 · 3 = 1200 м³."},
 {t:"Формула пути",q:"Скорость самолёта 800 км/ч. Какое расстояние он пролетит за 15 минут?",o:["200 км","12 000 км","400 км","53 км"],a:0,
  e:"15 мин — это четверть часа. s = v · t = 800 : 4 = 200 км."},
 {t:"Симметрия",q:"Сколько осей симметрии у прямоугольника (который не квадрат)?",o:["2","1","4","0"],a:0,
  e:"Одна ось делит его пополам по горизонтали, вторая — по вертикали. 4 оси бывают только у квадрата."},
 {t:"Задача",q:"В двух классах 60 учеников, причём в одном на 8 учеников больше, чем в другом. Сколько учеников в каждом классе?",o:["26 и 34","30 и 38","22 и 38","52 и 8"],a:0,
  e:"60 − 8 = 52 — это два равных класса; 52 : 2 = 26. Во втором 26 + 8 = 34. Проверка: 26 + 34 = 60."}
];

const L = ["А","Б","В","Г"];
/* Time limits in seconds: norm 20 min; ≤15 min with a 5 = "excellent on time"; >25 min = one grade down */
const NORM = 20*60, FAST = 15*60, SLOW = 25*60;
const HK = "polad-exam-hist";
let order, idx, answers, t0 = null, tick = null, finalSec = 0;
const stage = document.getElementById("stage");
const prog = document.getElementById("progress");
const timerEl = document.getElementById("timer");
const tval = document.getElementById("tval");

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- timer: wall-clock based, so switching tabs never pauses it ---- */
const fmt = s => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0"); };
const elapsed = () => t0 ? (Date.now() - t0)/1000 : 0;
const warn = e => { e.preventDefault(); e.returnValue = ""; };
function updateTimer(){
  const s = elapsed();
  tval.textContent = fmt(s);
  timerEl.classList.toggle("warn", s > FAST && s <= NORM);
  timerEl.classList.toggle("over", s > NORM);
}
function startTimer(){ t0 = Date.now(); timerEl.className = "timer"; timerEl.hidden = false; updateTimer(); clearInterval(tick); tick = setInterval(updateTimer, 500); window.addEventListener("beforeunload", warn); }
function stopTimer(){ clearInterval(tick); tick = null; window.removeEventListener("beforeunload", warn); const s = elapsed(); updateTimer(); return s; }
document.addEventListener("visibilitychange", () => { if (tick) updateTimer(); });

/* ---- history of attempts: every attempt is kept forever (never trimmed); last 3 shown here, all on istoriya.html ---- */
const loadHist = () => { try { return JSON.parse(localStorage.getItem(HK)) || []; } catch(e){ return []; } };
const saveHist = r => { try { const h = loadHist(); h.unshift(r); localStorage.setItem(HK, JSON.stringify(h)); } catch(e){} };
const clock = d => new Date(d).toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
const day = d => new Date(d).toLocaleDateString("ru-RU", {day:"2-digit", month:"2-digit"});
/* older records had only a finish stamp `d`; derive start/end for them */
const normRec = r => ({...r, s: r.s ?? (r.d - (r.t||0)*1000), e: r.e ?? r.d});
function histHTML(markFirst){
  const all = loadHist().map(normRec);
  if (!all.length) return "";
  const avg = (all.reduce((a,r)=>a+r.g,0)/all.length).toFixed(1).replace(".",",");
  const h = all.slice(0, 3);
  return `<section class="card">
    <div class="qhead"><span class="topic">Последние результаты</span><a class="more" href="istoriya.html">Вся история →</a></div>
    <ol class="hist">${h.map((r,i) =>
      `<li${markFirst && i===0 ? ' class="now"' : ''}><span class="hd">${day(r.s)} · ${clock(r.s)} → ${clock(r.e)}</span><b>${r.n}/${r.len || 20}</b><span class="ht">⏱ ${fmt(r.t)}</span><span class="hg">${r.g}</span></li>`
    ).join("")}</ol>
    <p class="sum">Всего экзаменов: <b>${all.length}</b> · средняя оценка: <b>${avg}</b></p>
  </section>`;
}

function intro(){
  clearInterval(tick); tick = null; t0 = null; timerEl.hidden = true; timerEl.className = "timer";
  order = null; idx = 0; answers = []; prog.innerHTML = "";
  stage.innerHTML = `
    <section class="card">
      <span class="topic">Перед стартом</span>
      <p class="qtext">20 вопросов на время</p>
      <ul class="rules">
        <li>⏱ Норма — <b>20 минут</b>. Таймер запустится по кнопке и не остановится до последнего ответа.</li>
        <li>⚡ Пятёрка быстрее чем за <b>15 минут</b> — «отлично по времени».</li>
        <li>🐢 Дольше <b>25 минут</b> — минус один балл.</li>
      </ul>
      <p class="hint">Сядь удобно, убери лишнее со стола и не закрывай вкладку: если выйти, экзамен начнётся заново.</p>
      <div class="actions"><button class="btn" id="go">Начать экзамен</button></div>
    </section>${histHTML(false)}`;
  document.getElementById("go").addEventListener("click", start);
}

function start(){
  /* a new order of questions AND of answers every time, so the sequence can't be memorised */
  order = shuffle(Q).map(q => ({...q, perm: shuffle([0,1,2,3])}));
  idx = 0; answers = []; finalSec = 0;
  startTimer();
  renderQ();
  window.scrollTo({top:0});
}

function renderProgress(){
  prog.innerHTML = order.map((_,i)=>{
    let c = "dot";
    if (answers[i]!==undefined) c += answers[i].ok ? " ok" : " bad";
    else if (i===idx) c += " cur";
    return `<span class="${c}"></span>`;
  }).join("");
}

function renderQ(){
  renderProgress();
  const q = order[idx];
  stage.innerHTML = `
    <section class="card">
      <div class="qhead"><span class="qnum">№ ${idx+1} из ${order.length}</span><span class="topic">${q.t}</span></div>
      <p class="qtext">${q.q}</p>
      <div class="opts">${q.perm.map((oi,k)=>`<button class="opt" id="opt${k}" data-k="${k}"><span class="letter">${L[k]}</span><span>${q.o[oi]}</span></button>`).join("")}</div>
      <div id="fb"></div>
      <div class="actions" id="act"></div>
    </section>`;
  stage.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => choose(+b.dataset.k)));
}

function choose(k){
  const q = order[idx];
  const correctK = q.perm.indexOf(q.a);
  const ok = k === correctK;
  answers[idx] = {ok, picked: q.o[q.perm[k]]};
  stage.querySelectorAll(".opt").forEach((b,i)=>{
    b.disabled = true;
    if (i===correctK) b.classList.add("right");
    else if (i===k) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  document.getElementById("fb").innerHTML =
    `<div class="feedback ${ok?"ok":"bad"}"><b>${ok?"Верно!":"Неверно. Правильный ответ: "+q.o[q.a]}</b>${q.e}</div>`;
  const last = idx === order.length-1;
  if (last) finalSec = stopTimer();   // the clock stops at the last answer, not at the results button
  document.getElementById("act").innerHTML = `<button class="btn" id="next">${last?"Узнать результат":"Дальше →"}</button>`;
  const nb = document.getElementById("next");
  nb.focus({preventScroll:true});
  nb.addEventListener("click", () => { if (last) finish(); else { idx++; renderQ(); window.scrollTo({top:0}); } });
  renderProgress();
}

function grade(n){ if(n>=18) return ["5","Отлично! Ты всё выучил."]; if(n>=14) return ["4","Хорошо! Повтори темы с ошибками."]; if(n>=10) return ["3","Неплохо, но надо ещё позаниматься."]; return ["2","Пока рано. Повтори тетрадь и попробуй снова."]; }

/* Final grade = knowledge grade adjusted by time: >25 min costs one point; ≤15 min with a 5 earns the "excellent on time" badge */
function timeGrade(n, sec){
  const [m, msg] = grade(n); const base = +m;
  let g = base, note = "", fast = false;
  if (sec > SLOW) { g = Math.max(2, base - 1); note = "Дольше 25 минут — минус один балл за время."; }
  else if (sec <= FAST) { if (base === 5) { fast = true; note = "Отлично по времени!"; } else note = "Быстро! Теперь подтяни точность."; }
  else note = "По времени — в норме.";
  return {g, base, msg, note, fast};
}

function finish(){
  idx = order.length; renderProgress();
  const n = answers.filter(a=>a.ok).length;
  const sec = finalSec || stopTimer();
  timerEl.classList.add("done");
  const r = timeGrade(n, sec);
  saveHist({s: t0, e: t0 + Math.round(sec*1000), n, len: order.length, t: Math.round(sec), g: r.g, base: r.base});
  const items = order.map((q,i)=>{
    const a = answers[i];
    return `<li class="${a.ok?"okk":""}"><div class="q">${i+1}. ${q.q}</div>
      <div class="a">${a.ok?"✓ "+q.o[q.a]:"Твой ответ: "+a.picked+" · Правильно: "+q.o[q.a]}</div></li>`;
  }).join("");
  stage.innerHTML = `
    <section class="card">
      <div class="score"><div class="mark" aria-label="Оценка ${r.g}">${r.g}</div>
        <div>
          <p class="big">${n} из ${order.length} верно</p>
          <p class="tline">⏱ Время: <b>${fmt(sec)}</b> <span class="norm">· норма 20:00</span></p>
          ${r.fast ? `<p class="badge">⚡ Отлично по времени!</p>` : `<p>${r.note}</p>`}
          ${r.g !== r.base ? `<p class="hint">По знаниям — ${r.base}, с учётом времени — ${r.g}.</p>` : ""}
          <p>${r.msg}</p>
        </div></div>
      <div class="actions"><button class="btn" id="again">Пройти ещё раз</button></div>
    </section>
    ${histHTML(true)}
    <section class="card"><span class="topic">Разбор ответов</span><ul class="review">${items}</ul></section>`;
  document.getElementById("again").addEventListener("click", () => { intro(); window.scrollTo({top:0}); });
  window.scrollTo({top:0});
}

intro();
</script>
