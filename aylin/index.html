<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренажёр Айлин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: одна колонка ~760px; сверху табель оценок, ниже вкладки Тесты / Шпаргалки / Ошибки / Дневник */
:root{
  --paper:#F2F4F8; --card:#FFFFFF; --ink:#17203A; --muted:#5A647A; --line:#DCE1EA; --soft:#E9EDF4;
  --accent:#3346C8; --accent-ink:#FFFFFF;
  --ok:#1E8655; --ok-bg:#E3F4EA; --bad:#C23A3A; --bad-bg:#FBE7E6; --warn:#B7791F; --warn-bg:#FBF0DC;
  --az:#C8324B; --wh:#B0731A; --geo:#11808A; --nat:#4C5BD4; --lit:#9446AC;
  --display:"Unbounded","Golos Text",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151F; --card:#1A2030; --ink:#E8ECF5; --muted:#9AA4BA; --line:#2C3448; --soft:#232A3C;
  --accent:#8B9BFF; --accent-ink:#0F1324;
  --ok:#53C28B; --ok-bg:#16302A; --bad:#FF7A72; --bad-bg:#3A1E22; --warn:#E8B04E; --warn-bg:#352A16;
  --az:#FF6F86; --wh:#E5A847; --geo:#45C3CC; --nat:#8F9BFF; --lit:#D18BE8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151F; --card:#1A2030; --ink:#E8ECF5; --muted:#9AA4BA; --line:#2C3448; --soft:#232A3C;
  --accent:#8B9BFF; --accent-ink:#0F1324;
  --ok:#53C28B; --ok-bg:#16302A; --bad:#FF7A72; --bad-bg:#3A1E22; --warn:#E8B04E; --warn-bg:#352A16;
  --az:#FF6F86; --wh:#E5A847; --geo:#45C3CC; --nat:#8F9BFF; --lit:#D18BE8; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,6vw,36px);font-weight:700;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:500}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Шапка и табель */
.top{display:flex;flex-direction:column;gap:14px}
.top-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sync{font-size:13px;color:var(--muted)}
.board{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cell{background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell .big{font-family:var(--display);font-size:34px;font-weight:700;line-height:1}
.cell .big small{font-size:15px;color:var(--muted);font-weight:500}
.cell .lbl{font-size:13px;color:var(--muted)}
.cell.main .big{font-size:44px}
@media (max-width:600px){.board{grid-template-columns:1fr 1fr 1fr}.cell .big{font-size:28px}.cell.main{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:space-between}}

.g5{color:var(--ok)}.g4{color:var(--accent)}.g3{color:var(--warn)}.g2{color:var(--bad)}.g0{color:var(--muted)}

/* Вкладки */
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:14px;overflow-x:auto}
.tab{flex:1 0 auto;border:0;background:transparent;padding:10px 14px;border-radius:10px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:12px;line-height:20px}

/* Карточки предметов */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.subj:hover{transform:translateY(-2px);border-color:var(--c)}
.subj::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.subj h3{font-size:15px;font-weight:700;font-family:var(--display);color:var(--c)}
.subj .meta{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.subj .go{margin-top:auto;font-weight:600;font-size:14px}
.subj.mix{--c:var(--accent);background:linear-gradient(135deg,var(--card),var(--soft))}
.c-az{--c:var(--az)}.c-wh{--c:var(--wh)}.c-geo{--c:var(--geo)}.c-nat{--c:var(--nat)}.c-lit{--c:var(--lit)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.note{font-size:14px;color:var(--muted)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--warn-bg);border:1px solid var(--warn);border-radius:14px;padding:12px 16px}

.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Тест */
.quiz{display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12px;display:grid;place-items:center;padding:0}
.dot.done{background:var(--soft);border-color:var(--muted)}
.dot.cur{border:2px solid var(--accent);font-weight:700}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-size:16px}
.opt .k{flex:0 0 28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.qnav{display:flex;justify-content:space-between;gap:10px}

/* Итог */
.result{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.stamp{width:120px;height:120px;border-radius:50%;border:4px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-size:60px;font-weight:700;transform:rotate(-8deg)}
@media (max-width:480px){.result{grid-template-columns:1fr;justify-items:center;text-align:center}}

.mist{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.mist .q{font-weight:600}
.ans{font-size:15px;padding:6px 10px;border-radius:8px}
.ans.no{background:var(--bad-bg);color:var(--bad)}
.ans.yes{background:var(--ok-bg);color:var(--ok)}
.why{font-size:14px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.chip.link{border-color:var(--accent);color:var(--accent);background:transparent}
.tag{font-size:12px;font-weight:700;color:var(--c)}

/* Шпаргалки */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.cheat{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin-top:16px}
.cheat.flash{animation:flash 1.4s}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.cheat h3{font-family:var(--display);font-weight:700;font-size:16px}
.cheat ul.facts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cheat dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.cheat dt{font-weight:700}.cheat dd{margin:0}
.cheat table{border-collapse:collapse;width:100%;font-size:15px}
.cheat td,.cheat th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.cheat .formula{font-family:var(--display);font-size:24px;padding:8px 0}
.tblwrap{overflow-x:auto}
@media (max-width:480px){.cheat dl{grid-template-columns:1fr}}

/* Дневник */
.days{width:100%;border-collapse:collapse;font-size:15px}
.days th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.days td{padding:10px 8px;border-bottom:1px solid var(--line)}
.days td.g{font-family:var(--display);font-weight:700;font-size:18px}
.bars{display:flex;flex-direction:column;gap:10px}
.sbar{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.sbar .track{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.sbar .track i{display:block;height:100%;background:var(--c)}
@media (max-width:480px){.sbar{grid-template-columns:100px 1fr 40px}}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="top-row">
      <div>
        <div class="eyebrow">Тренажёр МЦКО · 6 класс</div>
        <h1>Айлин</h1>
      </div>
      <div class="sync" id="sync">Результаты сохраняются на этом устройстве</div>
    </div>
    <div class="board" id="board"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="tests" aria-selected="true">Тесты</button>
    <button class="tab" role="tab" data-tab="cheats" aria-selected="false">Шпаргалки</button>
    <button class="tab" role="tab" data-tab="fix" aria-selected="false">Ошибки<span class="badge" id="fixBadge" hidden>0</span></button>
    <button class="tab" role="tab" data-tab="diary" aria-selected="false">Дневник</button>
  </nav>
  <main id="view"></main>
</div>
<script>
// Формат вопроса: [id, тема, вопрос, [ВЕРНЫЙ, неверный, неверный, неверный], пояснение]
const SUBJECTS = {
  az:  { name: "История Азербайджана", short: "История АЗ", hue: "az" },
  wh:  { name: "Всеобщая история",     short: "Всеобщая",   hue: "wh" },
  geo: { name: "География",            short: "География",  hue: "geo" },
  nat: { name: "Природа",              short: "Природа",    hue: "nat" },
  lit: { name: "Литература",           short: "Литература", hue: "lit" }
};

const TOPICS = {
  "az-chrono": "Хронология и календари",
  "az-stone":  "Первобытный строй и каменный век",
  "az-low":    "Нижний палеолит. Азых",
  "az-mid":    "Средний и верхний палеолит",
  "wh-time":   "Счёт лет в истории",
  "wh-prim":   "Первобытное общество",
  "wh-egypt":  "Древний Египет",
  "wh-sumer":  "Шумер",
  "geo-space": "Пространство и его масштаб",
  "geo-plan":  "План, масштаб, направления",
  "geo-maps":  "Карты и координаты",
  "geo-gis":   "ГПС и ГИС",
  "nat-force": "Сила и её действие",
  "nat-grav":  "Сила тяжести",
  "nat-fric":  "Трение и сопротивление",
  "nat-arch":  "Сила Архимеда",
  "nat-bal":   "Уравновешенные силы",
  "lit-odys":  "Одиссей на острове циклопов",
  "lit-leg":   "Азербайджанские предания",
  "lit-oleg":  "Князь Олег",
  "lit-dast":  "Дастаны"
};

const BANK = {
az: [
["az01","az-chrono","Как называется вспомогательная дисциплина, изучающая последовательность исторических событий?",["Хронология","Археология","Эпиграфика","География"],"Хронология (греч. «хронос» — время, «логос» — наука) изучает последовательность событий."],
["az02","az-chrono","Что означает греческое слово «хронос»?",["Время","Наука","Камень","Древний"],"«Хронос» — время, «логос» — наука, учение."],
["az03","az-chrono","Что такое эра?",["Событие, момент, от которого ведётся летосчисление","Период длиной в 1000 лет","Название каменного века","Год рождения пророка"],"Эра — исходная точка отсчёта времени. От неё считают и в прошлое, и в настоящее."],
["az04","az-chrono","Что означает слово «хиджра»?",["Переселение","Рождество","Наука","Время"],"Хиджра — переселение пророка Мухаммеда из Мекки в Медину."],
["az05","az-chrono","В каком году произошло переселение пророка Мухаммеда из Мекки в Медину?",["622 году","476 году","1054 году","776 году"],"С 622 года ведётся календарь хиджры."],
["az06","az-chrono","Как переводится слово «милад»?",["Рождество","Переселение","Эра","Община"],"Милад — день рождения Иисуса Христа, Рождество. От него ведётся христианский календарь."],
["az07","az-stone","Когда на территории Азербайджана появились первые человеческие стада?",["Примерно 1,5 миллиона лет назад","Примерно 100 тысяч лет назад","Примерно 35 тысяч лет назад","Примерно 5 тысяч лет назад"],"Благоприятные природные условия позволили людям поселиться здесь около 1,5 млн лет назад."],
["az08","az-stone","По какому признаку учёные делят первобытнообщинный строй на периоды?",["По материалу, из которого делали орудия труда","По климату","По количеству людей в общине","По видам жилищ"],"Отсюда названия: каменный век, период бронзы, период железа."],
["az09","az-stone","Какой период первобытнообщинного строя самый древний?",["Каменный век","Период бронзы","Период железа","Энеолит"],"Каменный век прошёл три стадии: палеолит, мезолит, неолит."],
["az10","az-stone","Как называется средний каменный век?",["Мезолит","Неолит","Палеолит","Энеолит"],"Палеолит — древний, мезолит — средний, неолит — новый каменный век."],
["az11","az-stone","Как называется новый каменный век?",["Неолит","Мезолит","Палеолит","Энеолит"],"Неолит — новый каменный век."],
["az12","az-stone","Энеолит — это период…",["перехода к использованию металла (конец каменного века)","самого начала каменного века","господства женщины в роду","появления «человека умелого»"],"«Eneos» по-латыни — медь, «litos» по-гречески — камень."],
["az13","az-stone","С появлением кого начался нижний палеолит?",["«Человека умелого»","Неандертальца","«Человека разумного»","Азыхантропа"],"Первая стадия палеолита началась с появления «человека умелого»."],
["az14","az-stone","Какое хозяйство называют присваивающим?",["Охоту и собирательство готовых продуктов природы","Земледелие и скотоводство","Ремесло и торговлю","Изготовление бронзы"],"Люди присваивали то, что давала природа: плоды, ягоды, коренья, добычу охоты."],
["az15","az-stone","Какие орудия труда были у людей первыми?",["Остроконечные камни, палка-копалка и дубинка","Лук и стрелы","Плуг и серп","Бронзовые мечи"],"Лук появился позже (в мезолите), плуг и бронза — ещё позже."],
["az16","az-stone","Каким огнём сначала пользовались древние люди?",["Природным — от молнии или самовоспламенения","Добытым ударом кремня","Добытым трением палочек","Огнём из печи"],"Сначала огонь брали у природы и берегли, чтобы он не погас."],
["az17","az-stone","Как называются первые непостоянные коллективы древних людей?",["Ранние общины","Родовые общины","Соседские общины","Племена"],"Ранние общины часто распадались и создавались заново."],
["az18","az-low","Как называется культура нижнего палеолита на территории Азербайджана?",["Гуручайская","Азыхская","Гобустанская","Кюльтепинская"],"Материалы найдены в Азыхской пещере в долине реки Гуручай."],
["az19","az-low","Почему культуру нижнего палеолита назвали Гуручайской?",["Материалы найдены в Азыхской пещере в долине реки Гуручай","Её открыл учёный Гуручаев","Так называлось первое племя","Там нашли первую бронзу"],"Название дано по реке Гуручай."],
["az20","az-low","Где расположена Азыхская пещера (по тексту учебника)?",["В Ходжавендском районе Карабаха","В Нахчыване","В Газахе","В Кяльбаджаре"],"Азыхская пещера — в Ходжавендском районе Карабахской зоны."],
["az21","az-low","Следы очага в Азыхской пещере относятся к периоду…",["700 тысяч лет назад","1,5 миллиона лет назад","100 тысяч лет назад","35 тысяч лет назад"],"Жители Азыха очень рано освоили огонь — очагу около 700 тыс. лет."],

  const it = quiz.items[quiz.idx], q = Q[it.id], n = quiz.items.length;
  const done = quiz.items.filter(x => x.pick != null).length;
  $("#view").innerHTML = `<section class="quiz">
    <div class="qhead"><div><div class="eyebrow">${esc(quiz.title)}</div><h2 class="num">Вопрос ${quiz.idx+1} из ${n}</h2></div>
      <button class="btn ghost" id="quit">Выйти (сохранится)</button></div>
    <div class="bar"><i style="width:${done/n*100}%"></i></div>
    <div class="qcard">
      <span class="tag c-${q.s}">${SUBJECTS[q.s].short} · ${TOPICS[q.t]}</span>
      <div class="qtext">${esc(q.q)}</div>
      <div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="${it.pick===o}"><span class="k">${"АБВГ"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    </div>
    <div class="qnav"><button class="btn ghost" id="prev" ${quiz.idx===0?"disabled":""}>← Назад</button>
      ${quiz.idx < n-1 ? `<button class="btn" id="next" ${it.pick==null?"disabled":""}>Дальше →</button>` : `<button class="btn" id="finish">Завершить тест</button>`}</div>
    <div class="dots">${quiz.items.map((x,i)=>`<button class="dot num ${x.pick!=null?"done":""} ${i===quiz.idx?"cur":""}" data-go="${i}" aria-label="Вопрос ${i+1}">${i+1}</button>`).join("")}</div>
    <p class="note" id="warn" hidden></p>
  </section>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    it.pick = it.opts[+b.dataset.i]; lsSet(DKEY, quiz);
    if (quiz.idx < n-1) setTimeout(() => { quiz.idx++; renderQuiz(); }, 220); else renderQuiz();
  });
  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { quiz.idx = +b.dataset.go; lsSet(DKEY, quiz); renderQuiz(); });
  $("#prev").onclick = () => { quiz.idx--; renderQuiz(); };
  if ($("#next")) $("#next").onclick = () => { quiz.idx++; renderQuiz(); };
  if ($("#finish")) $("#finish").onclick = () => {
    const left = quiz.items.filter(x => x.pick == null).length;
    if (left && !quiz.armed) { quiz.armed = true; const w = $("#warn"); w.hidden = false; w.textContent = `Без ответа ${left} ${plural(left,"вопрос","вопроса","вопросов")} — они засчитаются как ошибки. Нажми «Завершить тест» ещё раз или вернись к ним (номера без заливки).`; return; }
    finish();
  };
  $("#quit").onclick = () => { quiz = null; renderAll(); };
}
async function finish(){
  const items = quiz.items, ok = items.filter(x => x.pick === Q[x.id].right).length, n = items.length;
  const pct = Math.round(ok/n*100), wrongItems = items.filter(x => x.pick !== Q[x.id].right);
  const picks = {}; wrongItems.forEach(x => picks[x.id] = x.pick == null ? "" : x.pick);
  const a = {id:"a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts:Date.now(), day:dayKey(Date.now()), kind:quiz.kind, subj:quiz.subj, title:quiz.title,
    n, ok, pct, grade: gradeOf(pct), answered: items.map(x=>x.id), wrong: wrongItems.map(x=>x.id), picks, mins: Math.max(1, Math.round((Date.now()-quiz.started)/60000))};
  lsDel(DKEY);
  lastResult = {a, wrongItems};
  quiz = null;
  await saveAttempt(a);
  renderAll(); window.scrollTo(0,0);
}

function mistakeCard(id, pick){
  const q = Q[id];
  return `<div class="mist c-${q.s}">
    <span class="tag">${SUBJECTS[q.s].short} · ${TOPICS[q.t]}</span>
    <div class="q">${esc(q.q)}</div>
    <div class="ans no">Твой ответ: ${pick ? esc(pick) : "<i>без ответа</i>"}</div>
    <div class="ans yes">Правильно: ${esc(q.right)}</div>
    <div class="why">${esc(q.e)}</div>
    <div><button class="chip link" data-cheat="${q.t}">Открыть шпаргалку →</button></div>
  </div>`;
}
function bindCheatLinks(){
  document.querySelectorAll("[data-cheat]").forEach(b => b.onclick = () => openCheat(b.dataset.cheat));
}
function renderResult(){
  const {a, wrongItems} = lastResult, g = a.grade;
  const msg = g===5 ? "Отличная работа!" : g===4 ? "Хорошо! Разбери ошибки, и будет пятёрка." : g===3 ? "Неплохо. Повтори шпаргалки по темам ниже." : "Нужно повторить материал. Начни с разбора ошибок.";
  $("#view").innerHTML = `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="panel result">
      <div class="stamp num ${"g"+g}">${a.kind==="test"?g:a.pct+"%"}</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div class="eyebrow">${esc(a.title)}</div>
        <h2>${a.kind==="test" ? `Оценка ${g} — ${gradeWord(g)}` : (wrongItems.length ? "Ещё есть над чем поработать" : "Все ошибки исправлены!")}</h2>
        <div class="num">Правильно ${a.ok} из ${a.n} (${a.pct}%) · ${a.mins} мин</div>
        <div class="note">${a.kind==="test" ? msg : "Тренировка ошибок не влияет на оценку. Правильные ответы убираются из списка ошибок."}</div>
      </div>
    </div>
    <div class="row">${wrongItems.length ? `<button class="btn" id="fixNow">Исправить эти ошибки сейчас</button>` : ""}<button class="btn ghost" id="back">К тестам</button></div>
    ${wrongItems.length ? `<h2>Работа над ошибками · ${wrongItems.length}</h2>${wrongItems.map(x => mistakeCard(x.id, x.pick)).join("")}` : `<div class="panel empty">Ошибок нет 🎉</div>`}
  </section>`;
  bindCheatLinks();
  $("#back").onclick = () => { lastResult = null; tab = "tests"; renderAll(); };
  if ($("#fixNow")) $("#fixNow").onclick = () => {
    quiz = {kind:"fix", subj:"fix", title:"Работа над ошибками", items: makeItems(shuffle(wrongItems.map(x=>x.id))), idx:0, started:Date.now()};
    lsSet(DKEY, quiz); lastResult = null; renderAll(); window.scrollTo(0,0);
  };
}

// ---------- шпаргалки ----------
function openCheat(topic){
  quiz = null; lastResult = null; tab = "cheats"; cheatFilter = "all"; renderAll();
  const el = document.getElementById("cheat-"+topic);
  if (el) { el.scrollIntoView({behavior:"smooth", block:"start"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
function renderCheats(){
  const subs = Object.keys(SUBJECTS);
  const show = cheatFilter === "all" ? subs : [cheatFilter];
  $("#view").innerHTML = `<section style="display:flex;flex-direction:column;gap:14px">
    <div class="filters"><button class="chip" data-f="all" aria-pressed="${cheatFilter==="all"}">Все</button>${subs.map(s=>`<button class="chip" data-f="${s}" aria-pressed="${cheatFilter===s}">${SUBJECTS[s].short}</button>`).join("")}</div>
    ${show.map(s => `<h2 class="c-${s}" style="color:var(--c)">${SUBJECTS[s].name}</h2>` + Object.keys(TOPICS).filter(t => t.startsWith(s+"-")).map(t => `
      <article class="cheat c-${s}" id="cheat-${t}"><h3>${TOPICS[t]}</h3><div class="tblwrap">${CHEATS[t]||""}</div></article>`).join("")).join("")}
  </section>`;
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { cheatFilter = b.dataset.f; renderCheats(); });
}

// ---------- ошибки ----------
function renderFix(){
  const list = unresolved();
  if (!list.length) { $("#view").innerHTML = `<div class="panel empty"><h2>Ошибок нет</h2><p>Пройди тест — здесь появятся вопросы, на которые ответ был неверным. Они уйдут из списка, когда Айлин ответит правильно.</p></div>`; return; }
  const by = {}; list.forEach(x => (by[Q[x.id].s] = by[Q[x.id].s] || []).push(x));
  $("#view").innerHTML = `<section style="display:flex;flex-direction:column;gap:14px">
    <div class="panel"><h2>${list.length} ${plural(list.length,"ошибка","ошибки","ошибок")} ждут исправления</h2>
      <p class="note">Сначала прочитай разбор и шпаргалку, потом нажми «Тренировать». Вопрос уходит из списка после правильного ответа.</p>
      <div class="row"><button class="btn" data-fix="">Тренировать все (до ${FIX_MAX})</button>${Object.keys(by).map(s=>`<button class="chip c-${s}" data-fix="${s}" style="color:var(--c)">${SUBJECTS[s].short} · ${by[s].length}</button>`).join("")}</div></div>
    ${Object.keys(by).map(s => `<h2 class="c-${s}" style="color:var(--c)">${SUBJECTS[s].name}</h2>` + by[s].map(x => mistakeCard(x.id, x.pick)).join("")).join("")}
  </section>`;
  document.querySelectorAll("[data-fix]").forEach(b => b.onclick = () => startFix(b.dataset.fix));
  bindCheatLinks();
}

// ---------- дневник ----------
function renderDiary(){
  const t = tests();
  if (!t.length) { $("#view").innerHTML = `<div class="panel empty"><h2>Дневник пуст</h2><p>После первого теста здесь появятся оценки по дням и по предметам.</p></div>`; return; }
  const days = {}; t.forEach(a => (days[a.day] = days[a.day] || []).push(a));
  const keys = Object.keys(days).sort().reverse();
  const subjRows = Object.keys(SUBJECTS).concat("mix").map(s => {
    const m = t.filter(a=>a.subj===s), av = avg(m.map(a=>a.grade)), p = avg(m.map(a=>a.pct));
    const name = s==="mix" ? "Смешанный" : SUBJECTS[s].short;
    return `<div class="sbar ${s==="mix"?"":"c-"+s}" style="${s==="mix"?"--c:var(--accent)":""}"><span>${name}</span><span class="track"><i style="width:${p||0}%"></i></span><b class="num ${gcls(av)}">${fmt(av)}</b></div>`;
  }).join("");
  $("#view").innerHTML = `<section style="display:flex;flex-direction:column;gap:16px">
    <div class="panel"><h2>По предметам</h2><p class="note">Полоска — средний процент правильных ответов, справа — средняя оценка.</p><div class="bars">${subjRows}</div></div>
    <div class="panel"><h2>По дням</h2><div class="tblwrap"><table class="days"><thead><tr><th>День</th><th>Тесты</th><th>Средний %</th><th>Оценка дня</th></tr></thead><tbody>
      ${keys.map(k => { const d = days[k], av = avg(d.map(a=>a.grade)); return `<tr><td>${dateRu(k)}</td><td class="num">${d.length}</td><td class="num">${Math.round(avg(d.map(a=>a.pct)))}%</td><td class="g num ${gcls(av)}">${fmt(av)}</td></tr>`; }).join("")}
    </tbody></table></div></div>
    <div class="panel"><h2>Все тесты</h2><div class="tblwrap"><table class="days"><thead><tr><th>Когда</th><th>Тест</th><th>Верно</th><th>Оценка</th></tr></thead><tbody>
      ${t.slice().reverse().map(a => `<tr><td class="num">${new Date(a.ts).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(a.title)}</td><td class="num">${a.ok}/${a.n}</td><td class="g num g${a.grade}">${a.grade}</td></tr>`).join("")}
    </tbody></table></div></div>
  </section>`;
}

setSync();
renderAll();
initCloud();
})();

</script>
</body>
</html>
